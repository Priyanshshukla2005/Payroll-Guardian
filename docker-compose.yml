version: '3.8'

services:
  # 1. PostgreSQL Database Service
  db:
    image: postgres:15-alpine
    container_name: payroll_guardian_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: payroll_guardian
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d payroll_guardian"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. FastAPI Backend Intelligence Service
  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: payroll_guardian_api
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    ports:
      - "8000:8000"
    environment:
      - APP_ENV=production
      - API_HOST=0.0.0.0
      - API_PORT=8000
      - DATABASE_URL=postgresql://postgres:postgres_secure_password_2026@db:5432/payroll_guardian
      - SECRET_KEY=payroll_guardian_enterprise_secret_key_2026_super_secure_phase10
      - ACCESS_TOKEN_EXPIRE_MINUTES=1440
      - LOG_LEVEL=INFO
      - AI_MODEL_VERSION=v2
      - LLM_PROVIDER=mock
      - LLM_MODEL=mock-grounded-v1
      - CORS_ALLOWED_ORIGINS=http://localhost:3000,http://127.0.0.1:3000,http://localhost:5173,http://127.0.0.1:5173
    volumes:
      - ./data:/app/data
      - ./models:/app/models

  # 3. React + Vite Frontend UI Service
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: payroll_guardian_frontend
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "3000:80"

volumes:
  postgres_data:
